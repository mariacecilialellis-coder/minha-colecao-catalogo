name: Sincronizar catálogo TCGdex

on:
  schedule:
    # Todo dia às 06:00 UTC (03:00 no horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: {}
  # Dá pra disparar a sincronização na hora com um simples git push (sem
  # precisar clicar em "Run workflow" no site) — usado pelo Claude Code pra
  # rodar assim que detectar que a TCGdex voltou do ar, sem depender de
  # ninguém clicar em nada. Pushes feitos pelo próprio bot desta Action (via
  # GITHUB_TOKEN) não disparam isso de novo, então não tem risco de loop.
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rodar sincronização
        run: node sync.mjs

      - name: Commitar mudanças (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Atualiza catálogo TCGdex $(date -u +%Y-%m-%d)"
          git push
